<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>董办AI看板</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #f0f2f5;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .gate-card {
    background: #fff;
    border-radius: 12px;
    padding: 40px 36px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.10);
    width: 380px;
    max-width: 90vw;
    text-align: center;
    border-top: 3px solid #1677ff;
  }
  .gate-card h1 { font-size: 20px; color: #1a2a4a; margin-bottom: 6px; }
  .gate-card .sub { font-size: 13px; color: #999; margin-bottom: 24px; }
  .gate-card input {
    width: 100%;
    padding: 12px 14px;
    font-size: 15px;
    border: 1px solid #d9d9d9;
    border-radius: 8px;
    outline: none;
    margin-bottom: 14px;
  }
  .gate-card input:focus { border-color: #1677ff; box-shadow: 0 0 0 2px rgba(22,119,255,0.15); }
  .gate-card button {
    width: 100%;
    padding: 12px;
    font-size: 15px;
    font-weight: 600;
    color: #fff;
    background: linear-gradient(135deg, #1677ff, #4096ff);
    border: none;
    border-radius: 8px;
    cursor: pointer;
  }
  .gate-card button:disabled { opacity: 0.6; cursor: wait; }
  .err { color: #d4380d; font-size: 13px; margin-top: 12px; display: none; }
  .tip { color: #bbb; font-size: 11px; margin-top: 18px; }
</style>
</head>

    <button type="submit" id="btn">进入看板</button>
  </form>
  <div class="err" id="err">密码不正确，请重试</div>
  <div class="tip">数据由定时任务自动更新 · 仅供内部参考</div>
</div>

const b64ToBytes = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));

async function unlock(pwd) {
  const raw = b64ToBytes(PAYLOAD);
  const salt = raw.slice(0, 16), iv = raw.slice(16, 28), data = raw.slice(28);
  const km = await crypto.subtle.importKey('raw', new TextEncoder().encode(pwd), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey(
    { name: 'PBKDF2', salt, iterations: 100000, hash: 'SHA-256' },
    km, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
  const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv }, key, data);
  const htmlText = new TextDecoder().decode(plain);
  // 验证通过：写入 localStorage（与监管看板同域共享，两个看板间切换/重开浏览器免输密码）
  try { localStorage.setItem('dash_pwd', pwd); } catch (_) {}
  // 从监管看板跳转来验证的：通过后自动跳回来源页
  const next = new URLSearchParams(location.search).get('next');
  if (next && next.indexOf('https://qychasedream.github.io/') === 0) { location.replace(next); return; }
  document.open(); document.write(htmlText); document.close();
}

document.getElementById('gateForm').addEventListener('submit', async e => {
  e.preventDefault();
  const pwd = document.getElementById('pwd').value;
  const btn = document.getElementById('btn');
  const err = document.getElementById('err');
  btn.disabled = true; btn.textContent = '验证中…'; err.style.display = 'none';
  try {
    await unlock(pwd);
  } catch (_) {
    err.style.display = 'block';
    btn.disabled = false; btn.textContent = '进入看板';
  }
});

// 此前已验证过（localStorage 持久）则直接进入，不再弹密码框
const cached = localStorage.getItem('dash_pwd');
if (cached) unlock(cached).catch(() => localStorage.removeItem('dash_pwd'));
